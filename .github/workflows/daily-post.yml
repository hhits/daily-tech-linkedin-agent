name: H&H TechPulse Daily LinkedIn Post

on:
  workflow_dispatch:
  schedule:
    # 09:00 Central Standard Time (UTC-6). Adjust to 14:00 UTC during daylight time if strict local 09:00 is required.
    - cron: '0 14 * * 1-5'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'

      - name: Test
        run: pytest -q

      - name: Publish daily post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202607' }}
        run: python -m techpulse.main

      - name: Commit updated topic history
        run: |
          git config user.name 'H&H TechPulse Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/topics.json
          git diff --cached --quiet || git commit -m 'chore: record published technology topic'
          git push
